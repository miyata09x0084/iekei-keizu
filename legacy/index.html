<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家系ラーメン家系図</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#2B1B12;
  --bg2:#37231A;
  --bg3:#432D21;
  --paper:#F1E7D2;
  --paper-dim:#B9A98E;
  --paper-faint:#7E6F5C;
  --line:rgba(241,231,210,.14);
  --shu:#D0402F;
  --brush:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif;
  --mincho:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --ui:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--paper);font-family:var(--ui);font-size:14px;line-height:1.6;
  overflow:hidden;
  background-image:
    radial-gradient(120% 90% at 50% 0%, rgba(241,231,210,.05), transparent 60%),
    radial-gradient(80% 60% at 50% 100%, rgba(0,0,0,.35), transparent 70%);
}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* ── header ── */
.bar{
  padding-block:14px 12px;padding-inline:22px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(0,0,0,.18), transparent);
}
.brand{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.brand h1{font-family:var(--brush);font-weight:400;font-size:36px;line-height:1;margin:0;letter-spacing:.1em;text-wrap:balance}
.brand h1 small{font-family:var(--mincho);font-size:15px;letter-spacing:.2em;color:var(--paper-dim);margin-left:10px}
.stats{display:flex;gap:22px;margin-left:auto;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column;line-height:1.2}
.stats b{font-family:var(--mincho);font-size:22px;font-weight:500}
.stats span{font-size:11px;color:var(--paper-dim);letter-spacing:.06em}

.controls{width:100%;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.group>span{font-size:12px;color:var(--paper-dim);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;background:transparent;color:var(--paper-dim);
  font:inherit;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.5;
  transition:color .15s,border-color .15s,background .15s;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--paper-dim));flex:none}
.chip:hover{color:var(--paper)}
.chip[aria-pressed="true"]{color:var(--paper);border-color:var(--paper-dim);background:rgba(241,231,210,.07)}
.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

.search{position:relative}
.search input{
  font:inherit;font-size:13px;color:var(--paper);background:var(--bg2);border:1px solid var(--line);border-radius:6px;
  padding:6px 10px 6px 30px;width:200px;
}
.search input::placeholder{color:var(--paper-faint)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:none;stroke:var(--paper-dim);stroke-width:1.8}

.year{display:flex;align-items:center;gap:10px}
.year output{font-family:var(--mincho);font-size:18px;font-variant-numeric:tabular-nums;min-width:3.2em;color:var(--paper)}
.year input[type=range]{width:150px;accent-color:var(--shu)}
.btn{
  font:inherit;font-size:12px;color:var(--paper-dim);background:transparent;border:1px solid var(--line);border-radius:6px;
  padding:4px 10px;cursor:pointer;
}
.btn:hover{color:var(--paper);border-color:var(--paper-dim)}

/* ── stage ── */
.stage{position:relative;overflow:hidden}
svg.tree{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.tree:active{cursor:grabbing}

.node{cursor:pointer;transition:opacity .5s ease}
.node text{font-family:var(--mincho);font-weight:500;fill:var(--paper);font-size:16px;pointer-events:none}
.node text.sub{font-size:11px;fill:var(--paper-dim)}
.node .hit{fill:transparent}
.node .mark{stroke-width:1.6}
.node .ring{fill:none;stroke-width:1.2}
.node.dim{opacity:.18}
.node.future{opacity:0;pointer-events:none}
.node.selected text.name{fill:#fff}
.node.selected .halo{opacity:1}
.node .halo{fill:none;stroke:var(--paper);stroke-opacity:.35;stroke-width:1;opacity:0;transition:opacity .2s}
.node:hover .name{fill:#fff}

.link{fill:none;stroke-width:1.4;transition:opacity .5s ease,stroke-opacity .2s}
.link.bus{stroke:var(--paper-faint)}
.link.disputed{stroke-dasharray:4 4}
.link.dim{opacity:.15}
.link.future{opacity:0}
g.has-lit .node:not(.lit):not(.future){opacity:.28}
g.has-lit .link:not(.lit):not(.future){opacity:.15}
g.has-lit .link.lit{stroke-width:2.2}

.outside-label{font-family:var(--mincho);font-size:12px;fill:var(--paper-dim);letter-spacing:.12em}
.outside-rule{stroke:var(--line);stroke-dasharray:2 5}

/* ── legend ── */
.legend{
  position:absolute;left:16px;bottom:16px;max-width:min(360px, calc(100% - 32px));
  background:rgba(43,27,18,.86);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  font-size:12px;color:var(--paper-dim);backdrop-filter:blur(6px);
}
.legend ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.legend li{display:flex;align-items:center;gap:8px;white-space:nowrap}
.legend svg{width:26px;height:16px;flex:none;overflow:visible}
.legend p{margin:8px 0 0;font-size:11px;color:var(--paper-faint);line-height:1.5}
.legend summary{cursor:pointer;color:var(--paper);font-family:var(--mincho);letter-spacing:.1em;list-style:none;display:flex;justify-content:space-between}
.legend summary::after{content:'−';color:var(--paper-dim)}
.legend details:not([open]) summary::after{content:'+'}
.legend details[open] summary{margin-bottom:8px}

.zoombar{position:absolute;right:16px;bottom:16px;display:flex;gap:4px}
.zoombar .btn{width:32px;height:32px;padding:0;font-size:16px;background:rgba(43,27,18,.86)}

/* ── panel ── */
.panel{
  position:absolute;top:16px;right:16px;bottom:16px;width:min(350px, calc(100% - 32px));
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:22px 24px 24px;overflow:auto;
  transform:translateX(calc(100% + 24px));transition:transform .4s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.panel.open{transform:none}
.panel .close{position:absolute;top:12px;right:12px}
.p-lineage{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--paper-dim);margin:0 0 6px}
.p-lineage .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.panel h2{font-family:var(--mincho);font-weight:700;font-size:34px;line-height:1.15;margin:0;letter-spacing:.04em}
.panel h2 span{font-size:16px;font-weight:500;color:var(--paper-dim);margin-left:8px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:18px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts dt{color:var(--paper-dim);font-size:12px;padding-top:2px}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.facts .badge{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;background:rgba(241,231,210,.08)}
.facts .badge.open{color:#9DC46C}
.facts .badge.closed{color:var(--paper-dim);text-decoration:line-through}
.note{margin:14px 0 0;line-height:1.75;max-width:36em}
.panel h3{font-family:var(--mincho);font-weight:500;font-size:13px;letter-spacing:.14em;color:var(--paper-dim);margin:20px 0 8px}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel .chip{font-family:var(--mincho);font-size:13px;color:var(--paper)}
.rel .none{color:var(--paper-faint);font-size:12px}

@media (max-width:640px){
  .bar{padding-inline:16px}
  .brand h1{font-size:28px}
  .stats{display:none}
  .search input{width:150px}
  .year input[type=range]{width:110px}
  .panel{
    top:auto;left:16px;right:16px;bottom:16px;width:auto;max-height:58%;
    transform:translateY(calc(100% + 24px));
  }
  .panel h2{font-size:28px}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){
  .node,.link,.panel{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>家系図<small>関東・家系ラーメンの系譜</small></h1>
    </div>
    <div class="stats" id="stats"></div>
    <div class="controls">
      <div class="group search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="屋号で探す" list="names" autocomplete="off" aria-label="屋号で探す">
        <datalist id="names"></datalist>
      </div>
      <div class="group"><span>系統</span><div class="chips" id="lineage-chips"></div></div>
      <div class="group"><span>都県</span><div class="chips" id="pref-chips"></div></div>
      <div class="group year">
        <span>年</span>
        <input type="range" id="year" min="1974" max="2026" value="2026" aria-label="表示する年">
        <output id="year-out" for="year">2026</output>
        <button class="btn" id="replay" type="button">1974年から再生</button>
      </div>
    </div>
  </header>

  <div class="stage">
    <svg class="tree" id="tree" role="img" aria-label="家系ラーメンの系図"></svg>

    <div class="legend">
      <details open>
        <summary>凡例</summary>
        <ul>
          <li><svg viewBox="0 0 26 16"><circle cx="13" cy="8" r="4" fill="#D0402F"/><circle cx="13" cy="8" r="7.5" fill="none" stroke="#D0402F" stroke-width="1.2"/></svg>直系（吉村家認定）</li>
          <li><svg viewBox="0 0 26 16"><circle cx="13" cy="8" r="4" fill="#B58AD1"/><circle cx="13" cy="8" r="7.5" fill="none" stroke="#B58AD1" stroke-width="1.2" stroke-dasharray="2 2.5"/></svg>元直系</li>
          <li><svg viewBox="0 0 26 16"><circle cx="13" cy="8" r="4" fill="#5B8BC0"/></svg>修行・独立</li>
          <li><svg viewBox="0 0 26 16"><circle cx="13" cy="8" r="4" fill="#2B1B12" stroke="#86AE55" stroke-width="1.6"/></svg>閉店・本店閉店</li>
          <li><svg viewBox="0 0 26 16"><path d="M2 8H24" stroke="#B9A98E" stroke-width="1.4"/></svg>暖簾分け・修行</li>
          <li><svg viewBox="0 0 26 16"><path d="M2 8H24" stroke="#B9A98E" stroke-width="1.4" stroke-dasharray="4 4"/></svg>諸説あり</li>
        </ul>
        <p>屋号にカーソルを合わせると吉村家までの系譜が浮かび、押すと詳細が開きます。系譜は公開情報を編集したもので、創業年は概算を含みます。</p>
      </details>
    </div>

    <div class="zoombar">
      <button class="btn" id="zin" type="button" aria-label="拡大">＋</button>
      <button class="btn" id="zout" type="button" aria-label="縮小">－</button>
      <button class="btn" id="zfit" type="button" aria-label="全体表示">⊡</button>
    </div>

    <aside class="panel" id="panel" aria-live="polite">
      <button class="btn close" id="close" type="button">閉じる</button>
      <p class="p-lineage"><span class="dot" id="p-dot"></span><span id="p-lineage"></span></p>
      <h2><span id="p-name"></span><span id="p-sub"></span></h2>
      <dl class="facts">
        <dt>所在地</dt><dd id="p-place"></dd>
        <dt>創業</dt><dd id="p-year"></dd>
        <dt>世代</dt><dd id="p-gen"></dd>
        <dt>関係</dt><dd id="p-edge"></dd>
        <dt>状態</dt><dd id="p-status"></dd>
      </dl>
      <p class="note" id="p-note"></p>
      <h3>師匠</h3><div class="rel" id="p-master"></div>
      <h3>弟子・暖簾分け</h3><div class="rel" id="p-kids"></div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
/* ───────────── データ ───────────── */
const LINEAGES = {
  root:    { label:'総本山',    color:'#F1E7D2' },
  direct:  { label:'直系',      color:'#D0402F' },
  honmoku: { label:'本牧家系',  color:'#5B8BC0' },
  rokkaku: { label:'六角家系',  color:'#86AE55' },
  ichi:    { label:'壱系',      color:'#E3B95A' },
  oudou:   { label:'王道家系',  color:'#B58AD1' },
  musashi: { label:'武蔵家系',  color:'#D39A66' },
  indep:   { label:'独立系',    color:'#E09A8E' },
  capital: { label:'資本系',    color:'#8E8577' },
};
const EDGE_LABEL   = { direct:'直系（吉村家認定）', former:'元直系（認定を離脱）', trained:'修行・独立', disputed:'修行・独立（諸説あり）' };
const STATUS_LABEL = { open:'営業中', closed:'閉店', 'main-closed':'本店閉店・支店が継承' };

// 系譜は公開情報を編集したもの。approx=true の創業年は概算。
const NODES = [
  { id:'yoshimura', name:'吉村家', sub:'横浜駅西口', pref:'神奈川', city:'横浜市西区', founded:1974, parent:null, lineage:'root', status:'open', edge:null,
    note:'1974年、吉村実氏が新杉田に創業。豚骨醤油のスープに酒井製麺の太麺、ほうれん草と海苔、チャーシュー。屋号の「家」がそのまま「家系」の名の由来になった。1999年に横浜駅西口へ移転し、今も総本山として行列が絶えない。' },

  { id:'honmoku', name:'本牧家', sub:'本牧', pref:'神奈川', city:'横浜市中区', founded:1985, parent:'yoshimura', lineage:'honmoku', status:'main-closed', edge:'trained',
    note:'吉村家の2号店として本牧に開店。店長だった神藤隆氏が独立して六角家を開き、本牧家自身も後に吉村家から独立した。本牧家系・六角家系という二大分流の源。' },
  { id:'suzuki', name:'寿々喜家', sub:'上星川', pref:'神奈川', city:'横浜市保土ケ谷区', founded:1995, approx:true, parent:'honmoku', lineage:'honmoku', status:'open', edge:'trained',
    note:'本牧家出身。上星川の住宅街で長く愛される本牧家系の代表格。' },

  { id:'rokkaku', name:'六角家', sub:'六角橋', pref:'神奈川', city:'横浜市神奈川区', founded:1988, parent:'honmoku', lineage:'rokkaku', status:'main-closed', edge:'trained',
    note:'本牧家の店長だった神藤隆氏が六角橋に開店。新横浜ラーメン博物館への出店で「家系」を全国区に押し上げた。本店は2017年に閉店、戸塚店が暖簾を守る。' },
  { id:'kaiichi', name:'介一家', sub:'', pref:'神奈川', city:'横浜市', founded:1992, approx:true, parent:'rokkaku', lineage:'rokkaku', status:'open', edge:'trained',
    note:'六角家出身。まろやかなスープで六角家系の味を継ぐ。' },
  { id:'takasago', name:'たかさご家', sub:'', pref:'神奈川', city:'横浜市中区', founded:1998, approx:true, parent:'rokkaku', lineage:'rokkaku', status:'open', edge:'trained',
    note:'六角家出身。横浜中心部で六角家系の味を伝える一軒。' },
  { id:'samurai', name:'侍', sub:'渋谷', pref:'東京', city:'渋谷区', founded:2002, approx:true, parent:'rokkaku', lineage:'rokkaku', status:'open', edge:'disputed',
    note:'東京の家系を代表する一軒。系譜上は六角家の流れとされることが多いが、位置づけには諸説ある。' },

  { id:'ichiroku', name:'壱六家', sub:'磯子', pref:'神奈川', city:'横浜市磯子区', founded:1994, parent:'rokkaku', lineage:'ichi', status:'open', edge:'trained',
    note:'六角家出身。うずらの卵を載せる独自のスタイルで「壱系」と呼ばれる一派の源流となった。' },
  { id:'ichihachi', name:'壱八家', sub:'', pref:'神奈川', city:'横浜市', founded:2001, approx:true, parent:'ichiroku', lineage:'ichi', status:'open', edge:'trained',

  { id:'ichinana', name:'壱七家', sub:'', pref:'神奈川', city:'横浜市', founded:2003, approx:true, parent:'ichiroku', lineage:'ichi', status:'open', edge:'trained',

  { id:'musashi', name:'武蔵家', sub:'千葉', pref:'千葉', city:'千葉市', founded:1997, approx:true, parent:'rokkaku', lineage:'musashi', status:'open', edge:'disputed',
    note:'千葉発、東京に多店舗を広げた武蔵家系の源流。ライス無料の文化を東京に根付かせた。系譜上の位置づけには諸説ある。' },
  { id:'musashi-nakano', name:'武蔵家', sub:'新中野', pref:'東京', city:'中野区', founded:2001, approx:true, parent:'musashi', lineage:'musashi', status:'open', edge:'trained',

  { id:'sugita-chiba', name:'杉田家', sub:'千葉店', pref:'千葉', city:'千葉市中央区', founded:2016, approx:true, parent:'sugita', lineage:'direct', status:'open', edge:'direct',
    note:'杉田家の暖簾分け。千葉における吉村家直系の拠点。' },
  { id:'kan2', name:'環２家', sub:'環状2号線', pref:'神奈川', city:'横浜市港南区', founded:1998, approx:true, parent:'yoshimura', lineage:'direct', status:'open', edge:'direct',
    note:'環状2号線沿いの直系店。ロードサイドで長く支持され、直系の中でも古参。' },
  { id:'atsugi', name:'厚木家', sub:'本厚木', pref:'神奈川', city:'厚木市', founded:2000, approx:true, parent:'yoshimura', lineage:'direct', status:'open', edge:'direct',
    note:'県央・厚木に構える直系店。' },
  { id:'suehiro', name:'末廣家', sub:'白楽', pref:'神奈川', city:'横浜市神奈川区', founded:2012, parent:'yoshimura', lineage:'direct', status:'open', edge:'direct',
    note:'六角橋商店街の近く、白楽に開店した直系店。' },

  { id:'oudou', name:'王道家', sub:'柏', pref:'千葉', city:'柏市', founded:2003, parent:'yoshimura', lineage:'oudou', status:'open', edge:'former',
    note:'清水裕正氏が吉村家で修行後、2003年に取手で創業。直系として認定されるも2019年に離脱し、柏へ移転。自家製麺を武器に独自の系譜を築いている。' },
  { id:'torakichi', name:'とらきち家', sub:'取手', pref:'茨城', city:'取手市', founded:2011, approx:true, parent:'oudou', lineage:'oudou', status:'open', edge:'trained',
    note:'王道家出身。茨城における王道家系の看板店。' },
  { id:'oudou-shirushi', name:'王道之印', sub:'柏', pref:'千葉', city:'柏市', founded:2019, approx:true, parent:'oudou', lineage:'oudou', status:'open', edge:'trained',
    note:'王道家の姉妹店。柏に王道家系の一角を形づくる。' },
  { id:'oudou-ishii', name:'王道いしい', sub:'柏', pref:'千葉', city:'柏市', founded:2020, approx:true, parent:'oudou', lineage:'oudou', status:'open', edge:'trained',
    note:'王道家出身の店主による柏の店。' },

  // 系図に載らない資本系（修行系譜に属さない）
  { id:'machida', name:'町田商店', sub:'町田', pref:'東京', city:'町田市', founded:2008, parent:null, lineage:'capital', status:'open', edge:null,
    note:'ギフトホールディングスが展開するチェーン。修行の系譜には属さない「資本系」の代表格で、家系を全国に広めた。' },
  { id:'konshin', name:'魂心家', sub:'', pref:'神奈川', city:'横浜市ほか', founded:2010, approx:true, parent:null, lineage:'capital', status:'open', edge:null,
    note:'企業が展開する資本系。関東を中心に多店舗化。' },
  { id:'ichikaku', name:'壱角家', sub:'', pref:'東京', city:'東京都ほか', founded:2013, approx:true, parent:null, lineage:'capital', status:'open', edge:null,
    note:'企業が展開する資本系。都内の駅前に多い。' },
];

/* ───────────── 定数 ───────────── */
const CH = 17, SUBCH = 12, MARK = 6, PAD_TOP = 10;
const LEVEL = 215, SIB = 44, BUS_OFFSET = 42;
const PREFS = ['神奈川','東京','千葉','茨城'];
const byId = new Map(NODES.map(n => [n.id, n]));
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function labelHeight(d){ return MARK + PAD_TOP + d.name.length*CH + (d.sub ? d.sub.length*SUBCH + 6 : 0); }

/* ───────────── レイアウト ───────────── */
const treeData = NODES.filter(n => n.lineage !== 'capital');
const root = d3.stratify().id(d => d.id).parentId(d => d.parent)(treeData);
root.sort((a,b) => a.data.founded - b.data.founded);
d3.tree().nodeSize([SIB, LEVEL]).separation((a,b) => a.parent === b.parent ? 1 : 1.4)(root);
const treeNodes = root.descendants();
treeNodes.forEach(d => { d.data.gen = d.depth; d.data.x = d.x; d.data.y = d.y; });

// 資本系は系図の右外に並べる
const maxX = d3.max(treeNodes, d => d.x);
const capitals = NODES.filter(n => n.lineage === 'capital');
capitals.forEach((n,i) => { n.x = maxX + 150 + i*SIB; n.y = LEVEL; n.gen = null; });

/* ───────────── 描画 ───────────── */
const svg = d3.select('#tree');
const g = svg.append('g');
const gLinks = g.append('g');
const gNodes = g.append('g');

// 系線：親ごとに「幹＋横棒」、子ごとに「縦の降り線」
const linkData = [];
treeNodes.filter(d => d.children).forEach(p => {
  const busY = p.children[0].y - BUS_OFFSET;
  const xs = p.children.map(c => c.x);
  linkData.push({ kind:'bus', id:p.id + ':bus', parent:p.data, children:p.children.map(c=>c.data),
    d:`M${p.x},${p.y + labelHeight(p.data)} V${busY} M${Math.min(...xs, p.x)},${busY} H${Math.max(...xs, p.x)}` });
  p.children.forEach(c => linkData.push({ kind:'drop', id:c.id, child:c.data, parent:p.data,
    d:`M${c.x},${busY} V${c.y - MARK - 1}` }));
});

gLinks.selectAll('path').data(linkData).join('path')
  .attr('class', d => `link ${d.kind} ${d.kind==='drop' ? d.child.edge : ''}`)
  .attr('data-id', d => d.id)
  .attr('d', d => d.d)
  .attr('stroke', d => d.kind === 'drop' ? LINEAGES[d.child.lineage].color : null);

const node = gNodes.selectAll('g.node').data(NODES).join('g')
  .attr('class', 'node')
  .attr('data-id', d => d.id)
  .attr('transform', d => `translate(${d.x},${d.y})`);

node.append('rect').attr('class','hit')
  .attr('x', -SIB/2 + 2).attr('y', -MARK - 6).attr('width', SIB - 4).attr('height', d => labelHeight(d) + 12);
node.append('circle').attr('class','halo').attr('r', MARK + 8);
node.filter(d => d.edge === 'direct' || d.edge === 'former').append('circle').attr('class','ring')
  .attr('r', MARK + 4).attr('stroke', d => LINEAGES[d.lineage].color)
  .attr('stroke-dasharray', d => d.edge === 'former' ? '2.5 2.5' : null);
node.append('circle').attr('class','mark').attr('r', MARK)
  .attr('fill', d => d.status === 'open' ? LINEAGES[d.lineage].color : 'var(--bg)')
  .attr('stroke', d => LINEAGES[d.lineage].color);

node.append('text').attr('class','name').attr('text-anchor','middle').attr('y', MARK + PAD_TOP)
  .selectAll('tspan').data(d => [...d.name]).join('tspan').attr('x', 0).attr('dy', CH).text(c => c);
node.filter(d => d.sub).append('text').attr('class','sub').attr('text-anchor','middle')
  .attr('y', d => MARK + PAD_TOP + d.name.length*CH + 6)
  .selectAll('tspan').data(d => [...d.sub]).join('tspan').attr('x', 0).attr('dy', SUBCH).text(c => c);

// 資本系の見出し
if (capitals.length) {
  const cx0 = capitals[0].x - SIB/2, cx1 = capitals[capitals.length-1].x + SIB/2;
  g.append('path').attr('class','outside-rule').attr('d', `M${cx0},${LEVEL - 26} H${cx1}`);
  g.append('text').attr('class','outside-label').attr('x', (cx0+cx1)/2).attr('y', LEVEL - 36).attr('text-anchor','middle').text('系譜に属さない店（資本系）');
}

/* ───────────── ズーム ───────────── */
const stage = document.querySelector('.stage');
const zoom = d3.zoom().scaleExtent([0.25, 3]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);

function fit(animate){
  const bb = g.node().getBBox();
  const W = stage.clientWidth, H = stage.clientHeight;
  // 幅を基準に収め、縮みすぎる時は吉村家を上中央に置いて下へ辿らせる
  const s = Math.max(Math.min((W - 60) / bb.width, (H - 60) / bb.height, 1.1), 0.72);
  const fitsAll = bb.height * s <= H - 60;
  const t = d3.zoomIdentity
    .translate(W/2 - (fitsAll ? (bb.x + bb.width/2) : root.x)*s, fitsAll ? H/2 - (bb.y + bb.height/2)*s : 36 - bb.y*s)
    .scale(s);
  (animate && !reducedMotion ? svg.transition().duration(600) : svg).call(zoom.transform, t);
}
function focusNode(id){
  const n = byId.get(id);
  const W = stage.clientWidth, H = stage.clientHeight;
  const panelW = (W > 640 && document.getElementById('panel').classList.contains('open')) ? 370 : 0;
  const s = Math.max(d3.zoomTransform(svg.node()).k, 1.1);
  const t = d3.zoomIdentity.translate((W - panelW)/2 - n.x*s, H/2 - (n.y + labelHeight(n)/2)*s).scale(s);
  (reducedMotion ? svg : svg.transition().duration(600)).call(zoom.transform, t);
}
document.getElementById('zin').onclick  = () => svg.transition().duration(250).call(zoom.scaleBy, 1.3);
document.getElementById('zout').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1/1.3);
document.getElementById('zfit').onclick = () => fit(true);
addEventListener('resize', () => fit(false));

/* ───────────── フィルタ ───────────── */
const state = { lineages:new Set(), prefs:new Set(), year:2026, query:'' };

function matches(n){
  if (state.lineages.size && !state.lineages.has(n.lineage)) return false;
  if (state.prefs.size && !state.prefs.has(n.pref)) return false;
  if (state.query && !(n.name + n.sub + n.city).includes(state.query)) return false;
  return true;
}
function applyFilters(){
  const hidden = new Set(), dim = new Set();
  NODES.forEach(n => {
    if (n.founded > state.year) hidden.add(n.id);
    else if (!matches(n)) dim.add(n.id);
  });
  node.classed('future', d => hidden.has(d.id)).classed('dim', d => dim.has(d.id));
  gLinks.selectAll('path')
    .classed('future', d => d.kind === 'drop' ? hidden.has(d.child.id) : d.children.every(c => hidden.has(c.id)))
    .classed('dim', d => d.kind === 'drop' ? (dim.has(d.child.id) && dim.has(d.parent.id)) : d.children.every(c => dim.has(c.id)));
}

function buildChips(container, items, set){
  const el = document.getElementById(container);
  items.forEach(({key, label, color}) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed','false');
    if (color) { b.style.setProperty('--c', color); b.innerHTML = '<span class="dot"></span>'; }
    b.append(label);
    b.onclick = () => {
      set.has(key) ? set.delete(key) : set.add(key);
      b.setAttribute('aria-pressed', set.has(key));
      applyFilters();
    };
    el.append(b);
  });
}
buildChips('lineage-chips', Object.entries(LINEAGES).filter(([k]) => k !== 'root').map(([k,v]) => ({key:k, label:v.label, color:v.color})), state.lineages);
buildChips('pref-chips', PREFS.map(p => ({key:p, label:p})), state.prefs);

const q = document.getElementById('q');
const dl = document.getElementById('names');
NODES.forEach(n => { const o = document.createElement('option'); o.value = n.name + (n.sub ? ' ' + n.sub : ''); dl.append(o); });
q.addEventListener('input', () => {
  state.query = q.value.trim().replace(/\s+/g,'');
  applyFilters();
  const exact = NODES.find(n => (n.name + n.sub) === state.query);
  if (exact) { select(exact.id); focusNode(exact.id); }
});
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const hit = NODES.find(matches);
  if (hit) { select(hit.id); focusNode(hit.id); }
});

/* ───────────── 年スライダー ───────────── */
const yearInput = document.getElementById('year'), yearOut = document.getElementById('year-out');
function setYear(y){
  state.year = y; yearInput.value = y; yearOut.value = y; applyFilters();
}
yearInput.addEventListener('input', () => setYear(+yearInput.value));

let timer = null;
function replay(){
  if (timer) timer.stop();
  if (reducedMotion) { setYear(2026); return; }
  const dur = 2800;
  timer = d3.timer(el => {
    const t = Math.min(1, el / dur);
    setYear(Math.round(1974 + d3.easeCubicOut(t) * (2026 - 1974)));
    if (t >= 1) { timer.stop(); timer = null; }
  });
}
document.getElementById('replay').onclick = replay;

/* ───────────── ハイライト（祖先を辿る） ───────────── */
function ancestry(id){
  const ids = new Set();
  let n = byId.get(id);
  while (n) { ids.add(n.id); n = n.parent ? byId.get(n.parent) : null; }
  return ids;
}
node.on('mouseenter', (e, d) => {
  const ids = ancestry(d.id);
  g.classed('has-lit', true);
  node.classed('lit', n => ids.has(n.id));
  gLinks.selectAll('path').classed('lit', l => l.kind === 'drop' ? ids.has(l.child.id) : ids.has(l.parent.id) && l.children.some(c => ids.has(c.id)));
}).on('mouseleave', () => {
  g.classed('has-lit', false);
  node.classed('lit', false);
  gLinks.selectAll('path').classed('lit', false);
});

/* ───────────── 詳細パネル ───────────── */
const panel = document.getElementById('panel');
const $ = id => document.getElementById(id);
function chip(n){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip';
  b.style.setProperty('--c', LINEAGES[n.lineage].color);
  b.innerHTML = '<span class="dot"></span>';
  b.append(n.name + (n.sub ? '（' + n.sub + '）' : ''));
  b.onclick = () => { select(n.id); focusNode(n.id); };
  return b;
}
function select(id){
  const n = byId.get(id);
  node.classed('selected', d => d.id === id);
  $('p-dot').style.setProperty('--c', LINEAGES[n.lineage].color);
  $('p-lineage').textContent = LINEAGES[n.lineage].label;
  $('p-name').textContent = n.name;
  $('p-sub').textContent = n.sub;
  $('p-place').textContent = `${n.pref}・${n.city}`;
  $('p-year').textContent = `${n.founded}年${n.approx ? '頃' : ''}`;
  $('p-gen').textContent = n.gen === null ? '系譜外' : n.gen === 0 ? '初代（総本山）' : `第${n.gen + 1}世代`;
  $('p-edge').textContent = n.edge ? EDGE_LABEL[n.edge] : (n.lineage === 'capital' ? '企業経営（修行系譜なし）' : '—');
  $('p-status').innerHTML = `<span class="badge ${n.status === 'open' ? 'open' : 'closed'}">${STATUS_LABEL[n.status]}</span>`;
  $('p-note').textContent = n.note;
  const master = $('p-master'); master.replaceChildren();
  n.parent ? master.append(chip(byId.get(n.parent))) : master.innerHTML = '<span class="none">なし</span>';
  const kids = $('p-kids'); kids.replaceChildren();
  const ch = NODES.filter(c => c.parent === n.id).sort((a,b) => a.founded - b.founded);
  ch.length ? ch.forEach(c => kids.append(chip(c))) : kids.innerHTML = '<span class="none">なし</span>';
  panel.classList.add('open');
}
node.on('click', (e, d) => { e.stopPropagation(); select(d.id); focusNode(d.id); });
$('close').onclick = () => { panel.classList.remove('open'); node.classed('selected', false); };
svg.on('click', () => { panel.classList.remove('open'); node.classed('selected', false); });

/* ───────────── 統計 ───────────── */
const gens = d3.max(treeNodes, d => d.depth) + 1;
$('stats').innerHTML = [
  [NODES.length, '店舗'], [gens, '世代'], [Object.keys(LINEAGES).length - 2, '系統'], ['1974', '創業年'],
].map(([v,l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('');

/* ───────────── 初期化 ───────────── */
fit(false);
setYear(reducedMotion ? 2026 : 1974);
requestAnimationFrame(() => replay());
</script>

</html>
